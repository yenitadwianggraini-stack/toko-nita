<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Shop - Dua Kolom</title>
    <style>
        /* --- Reset & Gaya Global --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif; /* Ataupun font lucu lainnya */
        }

        body {
            background-color: #1a1a1a; /* Latar gelap gelap */
            color: #fff;
            padding: 15px;
        }

        /* --- Gaya Header (Sesuai Gambar) --- */
        .header-container {
            border: 1px solid #ff80ab; /* Border pink */
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-link {
            color: #ff80ab;
            text-decoration: none;
            font-size: 14px;
        }

        .shop-title {
            color: #ff80ab;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title {
            color: #fff;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        /* --- KUNCI: Membuat Menjadi Dua Kolom --- */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Membuat 2 kolom sama besar */
            gap: 15px; /* Jarak antar kotak produk */
        }

        /* --- Gaya Kotak Produk (Card) --- */
        .product-card {
            background-color: #262626; /* Warna kotak sedikit lebih terang */
            border: 1px solid #444;
            border-radius: 15px;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Membuat tombol selalu di bawah */
        }

        .product-image-wrapper {
            background-color: #fff; /* Latar putih untuk gambar */
            border-radius: 12px;
            padding: 5px;
            width: 100%;
            height: 120px; /* Tinggi seragam untuk area gambar */
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .product-image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Gambar tidak terpotong */
        }

        .product-name {
            color: #ff80ab;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 3px;
        }

        .product-desc {
            color: #ccc;
            font-size: 11px;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .product-price {
            color: #ff80ab;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .add-cart-btn {
            background-color: #ff80ab;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .add-cart-btn:hover {
            background-color: #e91e63;
        }

        /* --- Responsif untuk HP Sangat Kecil --- */
        @media (max-width: 320px) {
            .product-grid {
                grid-template-columns: 1fr; /* Kembali jadi 1 kolom */
            }
        }
    </style>
</head>
<body>

    <!-- Bagian Header (Seperti di Gambar) -->
    <div class="header-container">
        <a href="#" class="back-link">← Kembali</a>
        <div class="shop-title">Pink Shop 🛍️</div>
        <div></div> <!-- Spacing -->
    </div>

    <h2 class="section-title">Katalog Produk Lucu</h2>

    <!-- CONTAINER GRID UNTUK DUA KOLOM -->
    <div class="product-grid">

        <!-- PRODUK 1: Headphone -->
        <div class="product-card">
            <div>
                <div class="product-image-wrapper">
                    <!-- Gunakan URL gambar headphone Anda -->
                    <img src="https://i.imgur.com/rS49R5V.png" alt="Headphone Pink">
                </div>
                <h3 class="product-name">Headphone Pink Gemas</h3>
                <p class="product-desc">Suara jernih dengan desain super imut!</p>
            </div>
            <div>
                <p class="product-price">Rp 250.000</p>
                <button class="add-cart-btn">🛒 + Keranjang</button>
            </div>
        </div>

        <!-- PRODUK 2: Mouse -->
        <div class="product-card">
            <div>
                <div class="product-image-wrapper">
                    <!-- Gunakan URL gambar mouse Anda -->
                    <img src="https://i.imgur.com/T0bC0E0.png" alt="Cute Wireless Mouse">
                </div>
                <h3 class="product-name">Cute Wireless Mouse</h3>
                <p class="product-desc">Ergonomis, silent click warna pink manis.</p>
            </div>
            <div>
                <p class="product-price">Rp 150.000</p>
                <button class="add-cart-btn">🛒 + Keranjang</button>
            </div>
        </div>

        <!-- ANDA BISA MENAMBAH PRODUK 3, 4, DST DI SINI -->

    </div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        input { padding: 8px; width: 250px; }
        ul { list-style-type: none; padding: 0; margin-top: 10px; }
        li { padding: 8px; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>

    <h2>Fitur Pencarian Live</h2>
    <input type="text" id="searchInput" onkeyup="cariData()" placeholder="Cari nama buah...">

    <ul id="daftarBuah">
        <li>Apel</li>
        <li>Alpukat</li>
        <li>Jeruk</li>
        <li>Pisang</li>
        <li>Mangga</li>
    </ul>

    <script>
        function cariData() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let items = document.querySelectorAll('#daftarBuah li');

            items.forEach(item => {
                let text = item.textContent.toLowerCase();
                item.style.display = text.includes(input) ? '' : 'none';
            });
        }
    </script>

</body>
</html>
